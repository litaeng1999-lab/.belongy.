<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>belongy</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #faf9f7;
      --surface: #ffffff;
      --border: #e8e4de;
      --text: #1a1814;
      --muted: #8a8278;
      --accent: #2c2825;
      --private: #7c3f2a;
      --private-bg: #fdf4f0;
      --private-border: #e8c5b5;
    }

    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      font-weight: 300;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-family: 'Pretendard', -apple-system, sans-serif;
      font-weight: 400;
      font-size: 1.1rem;
      letter-spacing: 0.12em;
    }

    header a {
      font-size: 0.8rem;
      color: var(--muted);
      text-decoration: none;
    }

    header a:hover { color: var(--text); }

    /* ── VIEWS ── */
    #list-view, #detail-view { display: none; }
    #list-view.active, #detail-view.active { display: block; }

    /* ── LIST ── */
    #list-view {
      max-width: 680px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    .post-card {
      display: flex;
      gap: 20px;
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      align-items: flex-start;
      transition: opacity 0.15s;
    }

    .post-card:hover { opacity: 0.7; }

    .post-card:first-child { border-top: 1px solid var(--border); }

    .card-thumb {
      width: 88px;
      height: 64px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--border);
    }

    .card-thumb-placeholder {
      width: 88px;
      height: 64px;
      flex-shrink: 0;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: var(--muted);
    }

    .card-body { flex: 1; min-width: 0; }

    .card-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .card-title {
      font-family: 'Pretendard', -apple-system, sans-serif;
      font-weight: 400;
      font-size: 1rem;
      line-height: 1.4;
    }

    .lock-badge {
      flex-shrink: 0;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      padding: 2px 7px;
      border: 1px solid var(--private-border);
      color: var(--private);
      background: var(--private-bg);
      border-radius: 2px;
    }

    .card-date {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .card-excerpt {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.6;
    }

    /* ── PRIVATE CARD (blurred excerpt) ── */
    .post-card.is-private .card-excerpt {
      filter: blur(3px);
      user-select: none;
      pointer-events: none;
    }

    /* ── DETAIL ── */
    #detail-view {
      max-width: 680px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    .back-btn {
      display: inline-block;
      font-size: 0.8rem;
      color: var(--muted);
      cursor: pointer;
      margin-bottom: 36px;
      letter-spacing: 0.03em;
      border: none;
      background: none;
      font-family: inherit;
      padding: 0;
    }

    .back-btn:hover { color: var(--text); }

    .detail-private-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--private-bg);
      border: 1px solid var(--private-border);
      color: var(--private);
      font-size: 0.8rem;
      margin-bottom: 24px;
      letter-spacing: 0.03em;
    }

    #detail-view h1 {
      font-family: 'Pretendard', -apple-system, sans-serif;
      font-weight: 500;
      font-size: 1.8rem;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .detail-date {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .detail-content {
      font-family: 'Pretendard', -apple-system, sans-serif;
      font-size: 1rem;
      line-height: 1.9;
      color: var(--text);
    }

    .detail-content img {
      max-width: 100%;
      margin: 20px 0;
      display: block;
    }

    .detail-content a {
      color: var(--accent);
      text-decoration: underline;
    }

    .detail-content ul {
      padding-left: 1.4em;
      margin: 8px 0;
    }

    /* ── LOCK MODAL ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(26,24,20,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--surface);
      padding: 36px;
      border: 1px solid var(--border);
      width: 320px;
      text-align: center;
    }

    .modal .lock-emoji {
      font-size: 2rem;
      margin-bottom: 12px;
    }

    .modal h3 {
      font-family: 'Pretendard', -apple-system, sans-serif;
      font-weight: 400;
      font-size: 1.1rem;
      margin-bottom: 6px;
    }

    .modal p {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .modal input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 10px;
      text-align: center;
    }

    .modal input:focus { border-color: var(--accent); }

    .modal-error {
      font-size: 0.78rem;
      color: #c0392b;
      margin-bottom: 10px;
      display: none;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 11px;
      border: 1px solid var(--border);
      background: transparent;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text);
      letter-spacing: 0.03em;
    }

    .btn:hover { background: var(--border); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-primary:hover { opacity: 0.85; }

    /* ── EMPTY / LOADING ── */
    .state-msg {
      font-size: 0.85rem;
      color: var(--muted);
      padding: 48px 0;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <h1 onclick="showList()" style="cursor:pointer;">belongy</h1>
  <a href="https://litaeng1999-lab.github.io/.belongy./home.html">← 홈</a>
</header>

<!-- LIST VIEW -->
<div id="list-view" class="active">
  <div id="post-list"><p class="state-msg">불러오는 중…</p></div>
</div>

<!-- DETAIL VIEW -->
<div id="detail-view">
  <button class="back-btn" onclick="showList()">← 목록으로</button>
  <div id="private-banner" class="detail-private-banner" style="display:none;">🔒 비밀글입니다</div>
  <h1 id="detail-title"></h1>
  <div class="detail-date" id="detail-date"></div>
  <div class="detail-content" id="detail-content"></div>
</div>

<!-- LOCK MODAL -->
<div class="modal-backdrop" id="lock-modal">
  <div class="modal">
    <div class="lock-emoji">🔒</div>
    <h3>비밀글</h3>
    <p>관리자 비밀번호를 입력해주세요</p>
    <input type="password" id="lock-pw" placeholder="비밀번호" />
    <div class="modal-error" id="lock-error">비밀번호가 틀렸어요</div>
    <div class="modal-actions">
      <button class="btn" onclick="closeLockModal()">취소</button>
      <button class="btn btn-primary" onclick="unlockPost()">확인</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://qhgfmppamzzhhkflsufz.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoZ2ZtcHBhbXp6aGhrZmxzdWZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNjAyODIsImV4cCI6MjA5MTYzNjI4Mn0.rirTdPvZXhha0kIZqR8q2bSqo1Cwsn96RTga9LFWjtg';
  const PASSWORD = 'ahrdhkdwjfahrtjdrP0324@1m';

  let pendingPost = null; // 비밀번호 확인 대기 중인 글

  // ── API ──
  async function api(path) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      }
    });
    return res.json();
  }

  // ── LOAD LIST ──
  async function loadPosts() {
    const container = document.getElementById('post-list');
    try {
      const posts = await api('posts?select=*&order=created_at.desc');
      if (!posts.length) {
        container.innerHTML = '<p class="state-msg">아직 글이 없어요</p>';
        return;
      }

      container.innerHTML = posts.map(p => {
        const date = new Date(p.created_at).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
        const isPrivate = !!p.is_private;

        // 텍스트 미리보기 (HTML 태그 제거)
        const tmp = document.createElement('div');
        tmp.innerHTML = p.content || '';
        const excerpt = (tmp.textContent || '').slice(0, 80);

        const thumb = p.image_url
          ? `<img class="card-thumb" src="${p.image_url}" alt="" />`
          : isPrivate
            ? `<div class="card-thumb-placeholder">🔒</div>`
            : `<div class="card-thumb-placeholder">✦</div>`;

        return `
          <div class="post-card ${isPrivate ? 'is-private' : ''}" onclick="handleCardClick(${p.id}, ${isPrivate})">
            ${thumb}
            <div class="card-body">
              <div class="card-title-row">
                <span class="card-title">${p.title}</span>
                ${isPrivate ? '<span class="lock-badge">🔒 비밀글</span>' : ''}
              </div>
              <div class="card-date">${date}</div>
              ${excerpt ? `<div class="card-excerpt">${excerpt}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');

      // 각 카드에 post 데이터 바인딩
      posts.forEach((p, i) => {
        container.children[i]._postData = p;
      });

    } catch(e) {
      container.innerHTML = '<p class="state-msg">불러오기에 실패했어요</p>';
    }
  }

  // ── CARD CLICK ──
  function handleCardClick(postId, isPrivate) {
    const cards = document.querySelectorAll('.post-card');
    let post = null;
    cards.forEach(c => { if (c._postData && c._postData.id === postId) post = c._postData; });

    if (!post) return;

    if (isPrivate) {
      pendingPost = post;
      openLockModal();
    } else {
      openDetail(post);
    }
  }

  // ── DETAIL ──
  function openDetail(post) {
    document.getElementById('detail-title').textContent = post.title;
    document.getElementById('detail-date').textContent = new Date(post.created_at).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
    document.getElementById('detail-content').innerHTML = post.content || '';
    document.getElementById('private-banner').style.display = post.is_private ? 'flex' : 'none';

    document.getElementById('list-view').classList.remove('active');
    document.getElementById('detail-view').classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function showList() {
    document.getElementById('detail-view').classList.remove('active');
    document.getElementById('list-view').classList.add('active');
  }

  // ── LOCK MODAL ──
  function openLockModal() {
    document.getElementById('lock-pw').value = '';
    document.getElementById('lock-error').style.display = 'none';
    document.getElementById('lock-modal').classList.add('open');
    setTimeout(() => document.getElementById('lock-pw').focus(), 50);
  }

  function closeLockModal() {
    document.getElementById('lock-modal').classList.remove('open');
    pendingPost = null;
  }

  function unlockPost() {
    const pw = document.getElementById('lock-pw').value;
    if (pw === PASSWORD) {
      closeLockModal();
      openDetail(pendingPost);
    } else {
      document.getElementById('lock-error').style.display = 'block';
      document.getElementById('lock-pw').value = '';
      document.getElementById('lock-pw').focus();
    }
  }

  document.getElementById('lock-pw').addEventListener('keydown', e => {
    if (e.key === 'Enter') unlockPost();
  });

  document.getElementById('lock-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('lock-modal')) closeLockModal();
  });

  // ── INIT ──
  loadPosts();
</script>
</body>
</html>
